[General]
network = IDPSLab
sim-time-limit = 15s
result-dir = results
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
**.vector-recording = true
**.cmdenv-log-level = info

*.accessDelay = 10ms
*.inspectionDelay = 2ms
*.idps.rateWindow = 1s
*.idps.floodThreshold = 5
*.idps.scanWindow = 2s
*.idps.scanThreshold = 5
*.idps.authWindow = 3s
*.idps.authThreshold = 5
*.idps.blockDuration = 10s

*.clientA.sourceId = "client-A"
*.clientA.destinationSubnet = "dmz"
*.clientA.mode = "normal"
*.clientA.packetCount = 10
*.clientA.packetBytes = 500
*.clientA.startTime = 0.2s
*.clientA.sendInterval = 0.8s
*.clientA.basePort = 80

*.clientB.sourceId = "client-B"
*.clientB.destinationSubnet = "internal"
*.clientB.mode = "normal"
*.clientB.packetCount = 8
*.clientB.packetBytes = 700
*.clientB.startTime = 0.5s
*.clientB.sendInterval = 1s
*.clientB.basePort = 445

*.attackerWAN.sourceId = "attacker-WAN"
*.attackerWAN.destinationSubnet = "dmz"
*.attackerWAN.mode = "normal"
*.attackerWAN.packetCount = 0
*.attackerWAN.packetBytes = 500
*.attackerWAN.startTime = 0.5s
*.attackerWAN.sendInterval = 0.1s
*.attackerWAN.basePort = 80

*.attackerLANB.sourceId = "attacker-LANB"
*.attackerLANB.destinationSubnet = "internal"
*.attackerLANB.mode = "normal"
*.attackerLANB.packetCount = 0
*.attackerLANB.packetBytes = 500
*.attackerLANB.startTime = 0.6s
*.attackerLANB.sendInterval = 0.1s
*.attackerLANB.basePort = 445

[Config Normal]
extends = General

[Config SingleFlood]
extends = General
*.attackerWAN.mode = "flood"
*.attackerWAN.packetCount = 30

[Config SinglePortScan]
extends = General
*.attackerWAN.mode = "scan"
*.attackerWAN.packetCount = 12
*.attackerWAN.sendInterval = 0.3s
*.attackerWAN.basePort = 20

[Config SingleBruteForce]
extends = General
*.attackerWAN.mode = "bruteForce"
*.attackerWAN.packetCount = 12
*.attackerWAN.sendInterval = 0.4s
*.attackerWAN.basePort = 22

# Concurrent sources in separate subnets: an external WAN flood and an
# inside LAN-B port scan. Each source is tracked and blocked independently.
[Config MultipleAttackers]
extends = General
*.attackerWAN.mode = "flood"
*.attackerWAN.packetCount = 30
*.attackerLANB.mode = "scan"
*.attackerLANB.packetCount = 12
*.attackerLANB.sendInterval = 0.3s
*.attackerLANB.basePort = 2000

# A second simultaneous case makes both subnet sources flood the DMZ/internal service.
[Config MultiSubnetFlood]
extends = General
*.attackerWAN.mode = "flood"
*.attackerWAN.packetCount = 30
*.attackerLANB.mode = "flood"
*.attackerLANB.packetCount = 30

[Config NoPrevention]
extends = General
*.attackerWAN.mode = "flood"
*.attackerWAN.packetCount = 30
*.idps.floodThreshold = 1000
*.idps.scanThreshold = 1000
*.idps.authThreshold = 1000
