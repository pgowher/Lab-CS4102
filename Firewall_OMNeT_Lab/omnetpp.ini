[General]
network = FirewallLab
sim-time-limit = 8s
result-dir = results
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
**.vector-recording = true
**.cmdenv-log-level = info

*.accessDelay = 10ms
*.firewallDelay = 2ms
*.firewall.enableIPRule = true
*.firewall.enableSizeRule = true
*.firewall.enableRateRule = true
*.firewall.blockedIP = "203.0.113.99"
*.firewall.maxPacketBytes = 1200
*.firewall.maxPacketsPerWindow = 4
*.firewall.rateWindow = 1s

*.server.serverIP = "10.0.0.10"

*.client.sourceName = "normal-client"
*.client.sourceIP = "198.51.100.10"
*.client.destinationIP = "10.0.0.10"
*.client.mode = "normal"
*.client.packetCount = 8
*.client.packetBytes = 500
*.client.startTime = 0.2s
*.client.sendInterval = 0.8s

*.attacker.sourceName = "frequency-attacker"
*.attacker.sourceIP = "203.0.113.66"
*.attacker.destinationIP = "10.0.0.10"
*.attacker.mode = "normal"
*.attacker.packetCount = 0
*.attacker.packetBytes = 500
*.attacker.startTime = 0.4s
*.attacker.sendInterval = 0.1s

*.largePacketAttacker.sourceName = "large-packet-attacker"
*.largePacketAttacker.sourceIP = "203.0.113.77"
*.largePacketAttacker.destinationIP = "10.0.0.10"
*.largePacketAttacker.mode = "normal"
*.largePacketAttacker.packetCount = 0
*.largePacketAttacker.packetBytes = 2000
*.largePacketAttacker.startTime = 0.6s
*.largePacketAttacker.sendInterval = 0.5s

*.blockedIPAttacker.sourceName = "blocked-ip-attacker"
*.blockedIPAttacker.sourceIP = "203.0.113.99"
*.blockedIPAttacker.destinationIP = "10.0.0.10"
*.blockedIPAttacker.mode = "normal"
*.blockedIPAttacker.packetCount = 0
*.blockedIPAttacker.packetBytes = 500
*.blockedIPAttacker.startTime = 0.8s
*.blockedIPAttacker.sendInterval = 0.5s

[Config Normal]
extends = General

[Config FrequencyAttack]
extends = General
*.attacker.mode = "flood"
*.attacker.packetCount = 20
*.attacker.sendInterval = 0.1s

[Config FrequencyAttackNoRule]
extends = FrequencyAttack
*.firewall.enableRateRule = false

[Config SizeAttack]
extends = General
*.largePacketAttacker.mode = "oversized"
*.largePacketAttacker.packetCount = 6
*.largePacketAttacker.packetBytes = 2000

[Config SizeAttackNoRule]
extends = SizeAttack
*.firewall.enableSizeRule = false

[Config BlockedIPAttack]
extends = General
*.blockedIPAttacker.mode = "ip-test"
*.blockedIPAttacker.packetCount = 8

[Config BlockedIPNoRule]
extends = BlockedIPAttack
*.firewall.enableIPRule = false

[Config CombinedRules]
extends = General
*.attacker.mode = "flood"
*.attacker.packetCount = 20
*.attacker.sendInterval = 0.1s
*.largePacketAttacker.mode = "oversized"
*.largePacketAttacker.packetCount = 6
*.largePacketAttacker.packetBytes = 2000
*.blockedIPAttacker.mode = "ip-test"
*.blockedIPAttacker.packetCount = 8

[Config CombinedNoRules]
extends = CombinedRules
*.firewall.enableIPRule = false
*.firewall.enableSizeRule = false
*.firewall.enableRateRule = false
