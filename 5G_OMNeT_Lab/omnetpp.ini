[General]
network = FiveGStandaloneLab
sim-time-limit = 2s
**.cmdenv-log-level = info
result-dir = results
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
**.vector-recording = true

# Shared 5 Mbps uplink service at the gNB; QFI 7 is the configured high-priority flow.
*.gnb.ranDataRate = 5Mbps
*.gnb.highPriorityQfi = 7
*.gnb.maxQueuePackets = 160

[Config FastControlPlane]
extends = General
*.controlLinkDelay = 1ms
*.coreLinkDelay = 1ms

[Config LowRANCapacity]
extends = General
*.gnb.ranDataRate = 1.5Mbps

[Config HighLoad]
extends = General
*.ueUrllc1.packetCount = 100
*.ueUrllc1.sendInterval = 5ms
*.ueUrllc2.packetCount = 100
*.ueUrllc2.sendInterval = 5ms
*.ueEmbb1.packetCount = 100
*.ueEmbb1.sendInterval = 2.5ms
*.ueEmbb2.packetCount = 100
*.ueEmbb2.sendInterval = 2.5ms
*.gnb.maxQueuePackets = 40
