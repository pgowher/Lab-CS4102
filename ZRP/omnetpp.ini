[General]
network = ZrpNetwork
sim-time-limit = 80s
seed-set = 41
cmdenv-express-mode = false
record-eventlog = true
**.scalar-recording = true
**.vector-recording = false
*.host[9].oneWayDelay.vector-recording = true
*.host[9].hopCount.vector-recording = true
*.host[0].routeDiscoveryDelay.vector-recording = true

# Same ten-node geometry as the AODV mobility lab. The relay at host[2]
# travels between (520,325) and (520,500) and can break the central path.
*.host[0].x = 80m
*.host[0].y = 325m
*.host[1].x = 300m
*.host[1].y = 325m
*.host[2].x = 520m
*.host[2].y = 325m
*.host[3].x = 740m
*.host[3].y = 325m
*.host[4].x = 250m
*.host[4].y = 160m
*.host[5].x = 480m
*.host[5].y = 160m
*.host[6].x = 710m
*.host[6].y = 160m
*.host[7].x = 100m
*.host[7].y = 500m
*.host[8].x = 960m
*.host[8].y = 500m
*.host[9].x = 960m
*.host[9].y = 325m
*.host[*].range = 250m
*.host[*].zoneRadius = 2
