[General]
network = BlockchainLab
sim-time-limit = 60s
record-eventlog = false
**.numNodes = 5
**.difficulty = 1
**.blockInterval = 8s
**.txStartTime = 1s
**.txInterval = 3s
**.txScript = "Alice->Bob:2; Bob->Cara:1; Cara->Dev:1; Alice->Dev:3; Bob->Alice:1"
**.maxTxPerBlock = 2
**.linkDelay = 350ms
*.node[0].miner = true
*.node[2].miner = true

[Config Classroom]
description = "Two miners, five peers, shared transactions, and visible ledger convergence"

[Config SlowNetwork]
description = "Increase propagation delay and observe temporary disagreement"
**.linkDelay = 2s
**.blockInterval = 5s

[Config MiningRace]
description = "More miners create a higher chance of competing blocks"
*.node[1].miner = true
*.node[3].miner = true
**.difficulty = 2
**.blockInterval = 4s

[Config TamperDemo]
description = "One peer alters block data but keeps the original hash; peers reject it"
*.node[3].tamperFirstBlock = true
**.blockInterval = 8s

[Config QuietWalkthrough]
description = "Slow block production for instructor-led stepping"
**.linkDelay = 500ms
**.blockInterval = 15s
**.txInterval = 5s
