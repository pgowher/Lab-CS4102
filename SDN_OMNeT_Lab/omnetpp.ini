[General]
network = SDNLab
sim-time-limit = 8s
**.cmdenv-log-level = info
result-dir = results
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
**.vector-recording = true

# Network link delays: every link class is adjustable from this file.
*.hostLinkDelay = 10ms
*.trunkDelay = 20ms
*.controllerLinkDelay = 30ms

# Flow 1: cross-switch traffic from hostA to hostE.
*.hostA.isSender = true
*.hostA.destination = "hostE"
*.hostA.packetCount = 5
*.hostA.packetBytes = 1000
*.hostA.startTime = 0.2s
*.hostA.sendInterval = 1s

# Flow 2: cross-switch traffic from hostB to hostF.
*.hostB.isSender = true
*.hostB.destination = "hostF"
*.hostB.packetCount = 4
*.hostB.packetBytes = 800
*.hostB.startTime = 0.7s
*.hostB.sendInterval = 1.5s

# Flow 3: local traffic on switch s1.
*.hostC.isSender = true
*.hostC.destination = "hostB"
*.hostC.packetCount = 3
*.hostC.packetBytes = 600
*.hostC.startTime = 0.4s
*.hostC.sendInterval = 1s

# Flow 4: local traffic on switch s2.
*.hostD.isSender = true
*.hostD.destination = "hostE"
*.hostD.packetCount = 3
*.hostD.packetBytes = 1200
*.hostD.startTime = 1s
*.hostD.sendInterval = 1.2s

[Config FastController]
extends = General
*.controllerLinkDelay = 5ms

[Config HighLoad]
extends = General
*.hostA.packetCount = 10
*.hostA.sendInterval = 0.5s
*.hostB.packetCount = 8
*.hostB.sendInterval = 0.75s
*.hostC.packetCount = 6
*.hostC.sendInterval = 0.5s
*.hostD.packetCount = 6
*.hostD.sendInterval = 0.6s
