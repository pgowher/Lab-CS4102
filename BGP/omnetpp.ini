[General]
network = BgpFailoverNetwork
sim-time-limit = 160s
seed-set = 41
cmdenv-express-mode = false
record-eventlog = true

# INET's real BGP implementation exchanges OPEN, KEEPALIVE, UPDATE and
# withdrawal information between four autonomous systems.
**.bgpConfig = xmldoc("BGPConfig.xml")
**.bgp.startDelay = 2s
**.bgp.connectRetryTime = 5s
**.bgp.holdTime = 6s
**.bgp.keepAliveTime = 2s
*.west.bgp.routerId = "1.1.1.1"
*.north.bgp.routerId = "2.2.2.2"
*.east.bgp.routerId = "3.3.3.3"
*.south.bgp.routerId = "4.4.4.4"

**.tcp.typename = "Tcp"
**.tcp.mss = 1024
**.tcp.advertisedWindow = 14336
**.tcp.tcpAlgorithmClass = "TcpReno"
**.eth[*].queue.packetCapacity = 100

*.source.numApps = 1
*.source.app[0].typename = "PingApp"
*.source.app[0].destAddr = "10.0.3.100"
*.source.app[0].startTime = 20s
*.source.app[0].sendInterval = 1s
*.source.app[0].packetSize = 256B
*.source.app[0].printPing = true

# A clean stop triggers a BGP withdrawal; restarting lets the original path
# become available again. Do not add static inter-AS routes.
*.scenarioManager.script = xml("<script><at t='60s'><shutdown module='north'/></at><at t='100s'><startup module='north'/></at></script>")

**.scalar-recording = true
**.vector-recording = false
*.source.app[0].rtt.vector-recording = true

*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.numNetworkRouteVisualizers = 1
*.visualizer.networkRouteVisualizer[0].displayRoutes = true
*.visualizer.networkRouteVisualizer[0].packetFilter = "ping* and not *reply*"
*.visualizer.networkRouteVisualizer[0].lineColor = "black"
*.visualizer.networkRouteVisualizer[0].lineWidth = 5
*.visualizer.networkRouteVisualizer[0].fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer[0].fadeOutTime = 0.9s

*.visualizer.numPacketDropVisualizers = 1
*.visualizer.packetDropVisualizer[0].displayPacketDrops = true
*.visualizer.packetDropVisualizer[0].packetFilter = "ping*"
*.visualizer.packetDropVisualizer[0].labelFormat = "DROP: %r"
*.visualizer.packetDropVisualizer[0].iconTintColor = "red"
*.visualizer.packetDropVisualizer[0].labelColor = "red"
